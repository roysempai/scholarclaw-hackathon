# Production docker-compose for ScholarClaw
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:15-alpine
    container_name: scholarclaw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholarclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarclaw_prod}
      POSTGRES_DB: ${POSTGRES_DB:-scholarclaw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarclaw-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarclaw-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scholarclaw}:${POSTGRES_PASSWORD:-scholarclaw_prod}@db:5432/${POSTGRES_DB:-scholarclaw}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scholarclaw-net

volumes:
  postgres_data:

networks:
  scholarclaw-net:
    driver: bridge
