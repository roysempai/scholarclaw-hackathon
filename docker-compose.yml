version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scholarclaw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholarclaw
      POSTGRES_PASSWORD: scholarclaw_dev
      POSTGRES_DB: scholarclaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarclaw-backend
    restart: unless-stopped
    user: root  # Required for dev mode with volume mounts
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://scholarclaw:scholarclaw_dev@db:5432/scholarclaw
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    # Note: Remove volumes for production deployment (use docker-compose.prod.yml)
    volumes:
      - ./backend:/app
    command: sh -c "prisma generate && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholarclaw-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
