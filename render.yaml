services:
  - type: web
    name: scholarclaw-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholarclaw-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: FRONTEND_URL
        value: https://frontend-gold-omega-16.vercel.app
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: scholarclaw-db
    databaseName: scholarclaw
    user: scholarclaw
